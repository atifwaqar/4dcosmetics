# Pages CMS configuration — https://pagescms.org
#
# Powers a friendly, no-code admin form for adding/editing products.
# A team member signs in at https://app.pagescms.org, picks this repo, and gets
# this form instead of raw JSON.
#
# It reads/writes assets/data/products.json and uploads images into
# assets/img/products/. Field names match assets/schemas/products.schema.json,
# so saved entries pass the CI data-validation check.
#
# The form is ordered so the essentials a data-entry person fills are at the
# TOP; technical/optional fields (URL slug, tags, SKU, system ID) are at the
# bottom. Currency is fixed to PKR and hidden.

media:
  - name: product-images
    label: Product images
    input: assets/img/products
    output: /assets/img/products
    extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: products
    label: Products
    type: file
    path: assets/data/products.json
    list: true
    view:
      fields: [name, brand, inStock]
      primary: name
    fields:
      # ---------- ESSENTIALS (fill these top to bottom) ----------
      - name: name
        label: Product name
        type: string
        required: true
        description: The full product name shown to customers.

      - name: brand
        label: Brand
        type: string
        description: e.g. RBory, Roseberry, Art Skin.

      - name: images
        label: Product photos
        type: image
        list: true
        required: true
        options:
          media: product-images
        description: Upload one or more photos. The first one is the main thumbnail.

      - name: price
        label: Price
        type: object
        fields:
          - name: current
            label: Price (PKR)
            type: number
            required: true
          - name: old
            label: Old price (optional — shows a crossed-out discount)
            type: number
          - name: currency
            label: Currency
            type: select
            default: PKR
            hidden: true
            options:
              values: [PKR]

      - name: categories
        label: Categories
        type: select
        list: true
        required: true
        description: Pick the top-level category plus any sub-category that fits.
        options:
          multiple: true
          values:
            - { value: makeup, label: "Makeup (top-level)" }
            - { value: skin-care, label: "Skin Care (top-level)" }
            - { value: hair-care, label: "Hair Care (top-level)" }
            - { value: primer, label: "— Primer" }
            - { value: foundation, label: "— Foundation" }
            - { value: contour-concealer, label: "— Contour & Concealer" }
            - { value: highlighter, label: "— Highlighter" }
            - { value: face-powder, label: "— Face powder" }
            - { value: blush, label: "— Blush" }
            - { value: lipsticks, label: "— Lipsticks" }
            - { value: eye-shadow, label: "— Eye shadow" }
            - { value: eye-liner, label: "— Eye liner" }
            - { value: mascara, label: "— Mascara" }
            - { value: serums, label: "— Serums (Skin Care)" }
            - { value: creams, label: "— Creams (Skin Care)" }

      - name: shortDescription
        label: Short description
        type: text
        required: true
        description: One line shown on product cards and search results.

      - name: descriptionHTML
        label: Full description
        type: text
        required: true
        description: >-
          Shown on the product page. Plain text is fine; basic HTML tags
          (<p>, <b>, <br>) also work if you know them.

      - name: inStock
        label: In stock?
        type: boolean
        default: true
        description: Turn off when the product is sold out.

      # ---------- TECHNICAL / OPTIONAL (usually leave as-is) ----------
      - name: slug
        label: URL slug
        type: string
        required: true
        description: >-
          The product's web address (/p/<slug>). Lowercase words with hyphens,
          e.g. "rbory-face-primer". Tip: just type the product name in lowercase
          with hyphens instead of spaces. Must be unique.
        options:
          pattern:
            regex: "^[a-z0-9-]+$"
            message: Use only lowercase letters, numbers, and hyphens (no spaces).

      - name: tags
        label: Tags (optional)
        type: string
        list: true
        description: Short keywords for search, e.g. "matte", "non-greasy".

      - name: sku
        label: SKU / stock code (optional)
        type: string

      - name: id
        label: System ID — leave as-is (fills in automatically)
        type: uuid
