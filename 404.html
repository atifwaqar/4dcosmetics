<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found | 4D Cosmetics</title>
  <script>
    const path = window.location.pathname;
    if (path.startsWith('/c/') || path.startsWith('/p/')) {
      const shell = path.startsWith('/c/') ? '/c/' : '/p/';
      fetch(shell)
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {});
    }
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p><a href="/">Home</a></p>
</body>
</html>
