  <script>
  window.__updateCollectionProgress = function(viewed, total){
    var wrap = document.getElementById('cat-progress');
    if(!wrap) return;
    wrap.hidden = false;
    document.getElementById('cat-viewed').textContent = viewed;
    document.getElementById('cat-total').textContent = total;
    var pct = total ? Math.min(100, Math.round((viewed/total)*100)) : 0;
    document.getElementById('cat-bar').style.width = pct + '%';
  };
  </script>
