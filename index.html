<head>

</head>
<body data-active-tab="Beauty">
  
<div id="site-header"></div>
<script src="/assets/js/partials.js"></script>

  <main id="main" class="bnz-main">
    <section class="hero">
      <img src="/assets/img/banner.jpeg" alt="Assorted cosmetics displayed on a table" class="hero-img" width="1200" height="600" loading="eager" fetchpriority="high">
    </section>
    <section class="container-narrow">
      <div id="home-grid" class="product-grid"></div>
      <div class="bnz-progress" id="home-progress" hidden>
        <div class="bnz-progress__label">You’ve viewed <span id="viewed-count">0</span> of <span id="total-count">0</span> products</div>
        <div class="bnz-progress__bar"><span id="progress-bar" style="width:0%"></span></div>
      </div>
      <div class="bnz-loadmore"><button id="load-more" class="btn btn-outline-dark">Load More</button></div>
    </section>

    <section class="container-narrow">
      <div class="row row-cols-2 row-cols-md-4 g-3 text-center justify-content-center">
        <div class="col">
          <i class="fa-solid fa-certificate mb-2" aria-hidden="true"></i>
          <p class="mb-0">Authentic Products</p>
        </div>
        <div class="col">
          <i class="fa-solid fa-truck-fast mb-2" aria-hidden="true"></i>
          <p class="mb-0">Fast Shipping</p>
        </div>
        <div class="col">
          <i class="fa-solid fa-hand-holding-dollar mb-2" aria-hidden="true"></i>
          <p class="mb-0">Cash on Delivery</p>
        </div>
        <div class="col">
          <i class="fa-solid fa-tags mb-2" aria-hidden="true"></i>
          <p class="mb-0">Best Prices</p>
        </div>
      </div>
    </section>

    <section class="container-narrow reviews">
      <div class="reviews__row" aria-label="Customer reviews (sample)">
        <figure class="review">
          <figcaption>⭐️⭐️⭐️⭐️⭐️</figcaption>
          <blockquote>“Authentic products and super fast delivery to Rawalpindi.”</blockquote>
          <small>— Sana K.</small>
        </figure>
        <figure class="review">
          <figcaption>⭐️⭐️⭐️⭐️⭐️</figcaption>
          <blockquote>“Prices in PKR + COD on WhatsApp = so easy.”</blockquote>
          <small>— Aimen R.</small>
        </figure>
        <figure class="review">
          <figcaption>⭐️⭐️⭐️⭐️⭐️</figcaption>
          <blockquote>“Good packaging, original fragrances.”</blockquote>
          <small>— Raza S.</small>
        </figure>
      </div>
    </section>
  </main>
  
<div id="site-footer"></div>

  <script src="/assets/js/jquery-2.2.4.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/simpleCart.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/money.js"></script>
  <script src="/assets/js/storefront-runtime.js"></script>
  <script src="/assets/js/product-card.js"></script>
  <script src="/assets/js/tabs.js"></script>
  <script>
  (function(){
    var grid = document.getElementById('home-grid');
    var all = (window.__ALL_PRODUCTS__ || []);
    if (!all.length && window.Storefront && Storefront.getAllProducts) {
      Storefront.getAllProducts().then(function(items){
        all = items || [];
        init();
      });
    } else { init(); }
    function init(){
      var page = 0, size = 12;
      function render(){
        var slice = all.slice(0, (page+1)*size);
        grid.innerHTML = slice.map(function(p){ return window.ProductCard.renderProductCard(p); }).join('');
        var viewed = slice.length, total = all.length, pct = total? Math.min(100, Math.round((viewed/total)*100)) : 0;
        document.getElementById('home-progress').hidden = false;
        document.getElementById('viewed-count').textContent = viewed;
        document.getElementById('total-count').textContent = total;
        document.getElementById('progress-bar').style.width = pct + '%';
      }
      document.getElementById('load-more').addEventListener('click', function(){
        page++; render();
      });
      render();
    }
  })();
  </script>
  <script src="/assets/js/home-feed.js"></script>
  <script src="/assets/js/whatsapp-fab.js"></script>
  <script src="/assets/js/home-bonanza.js"></script>
  <script src="/assets/js/header-affordance.js" defer></script>
  <script src="/assets/js/cart-drawer.js" defer></script>
</body>
</html>
