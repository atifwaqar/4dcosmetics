<div class="home-enhanced">
  <!-- Hero -->
  <section class="hp-hero">
    <div class="hp-container-narrow hp-hero__inner">
      <h1 class="hp-hero__title">Premium Makeup & Skincare in PKR with Cash on Delivery</h1>
      <p class="hp-hero__sub">Curated, authentic brands. Fast shipping across Pakistan. Easy WhatsApp support.</p>
      <div class="hp-hero__cta">
        <a class="hp-btn" href="/search/?q=">Shop Products</a>
      </div>
    </div>
  </section>

  <!-- USPs -->
  <section class="hp-usp">
    <div class="hp-container-narrow hp-usp__row">
      <div class="hp-usp__item">Cash on Delivery</div>
      <div class="hp-usp__item">WhatsApp Support</div>
      <div class="hp-usp__item">Prices in PKR</div>
    </div>
  </section>

  <!-- Categories -->
  <nav class="hp-cats" aria-label="Shop by category">
    <div class="hp-container-narrow hp-cats__row">
      <a class="hp-chip" href="/search/?q=makeup">Makeup</a>
      <a class="hp-chip" href="/search/?q=skincare">Skincare</a>
      <a class="hp-chip" href="/search/?q=fragrance">Fragrance</a>
      <a class="hp-chip" href="/search/?q=accessories">Accessories</a>
      <a class="hp-chip" href="/search/?q=bundles">Bundles</a>
      <a class="hp-chip" href="/search/?q=gifts">Gifts</a>
    </div>
  </nav>

  <!-- All Products -->
  <section class="hp-container-narrow hp-shelf">
    <div class="hp-shelf__head">
      <h2>All Products</h2>
      <span class="hp-shelf__link" aria-hidden="true">Showing latest</span>
    </div>
    <div class="hp-grid" id="grid-all"></div>
    <button id="loadMore" class="hp-btn hp-load-more">Load More</button>
    <div id="progress" class="hp-progress" aria-live="polite"></div>
  </section>
</div>
