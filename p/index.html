<!DOCTYPE html>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><img src="/assets/img/logo.png" alt="4D Cosmetics logo" width="40" height="40"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="/cart.html">Cart (<span class="simpleCart_quantity">0</span>)</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb" id="breadcrumb"></ol>
      </nav>
      <a href="#" id="back-link" class="d-block mb-3">&laquo; Back</a>
      <div class="row">
        <div class="col-md-6">
            <img id="main-image" class="img-fluid item_image item_thumb" alt="" style="object-fit:cover;aspect-ratio:1/1;" width="600" height="600">
          <div class="mt-2" id="image-thumbs"></div>
        </div>
        <div class="col-md-6">
          <div class="simpleCart_shelfItem">
            <h1 id="product-title" class="item_name"></h1>
            <div id="product-badges" class="mb-2"></div>
            <span id="product-id" class="visually-hidden item_id"></span>
            <a id="product-url" href="#" class="visually-hidden item_url"></a>
            <p id="product-price" class="h4"></p>
            <p id="stock-status"></p>
            <p id="short-description"></p>
            <div id="category-badges" class="mb-3"></div>
            <div class="d-flex align-items-center mb-3">
              <label for="product-qty" class="me-2">Qty</label>
              <input id="product-qty" type="number" class="form-control item_Quantity" value="1" min="1" style="width:90px;">
            </div>
            <button type="button" class="btn btn-primary item_add mb-3">Add to Cart</button>
            <section id="details"></section>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="py-5 d-none" id="recently-viewed-section">
    <div class="container">
      <h2 class="mb-4">Recently viewed</h2>
      <div id="recently-viewed" class="row"></div>
    </div>
  </section>

  <footer class="py-4 mt-5">

      <p class="mb-2">© 4D Cosmetics</p>
