<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | 4D Cosmetics</title>
    <meta name="description" content="">
    <link rel="canonical" id="canonical-link" href="">
    <meta property="og:title" content="" id="og-title">
    <meta property="og:description" content="" id="og-description">
    <meta property="og:url" content="" id="og-url">
    <meta property="og:image" content="" id="og-image">
    <script type="application/ld+json" id="ld-json"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
  <div class="container nav-container">
    <a href="/" class="logo">4DCosmetics</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/c/makeup/">Makeup</a>
      <a href="/c/perfume/">Perfume</a>
      <a href="/c/skincare/">Skincare</a>
      <a href="/c/accessories/">Accessories</a>
    </nav>
    <div class="nav-actions">
      <form class="search-form" action="/search/" method="get">
        <input type="search" name="q" placeholder="Search products…" aria-label="Search">
      </form>
      <a href="/cart.html" class="cart-link">
        🛒 <span class="cart-count simpleCart_quantity">0</span>
      </a>
    </div>
  </div>
</header>

  <main id="main">
  <section class="py-5">
    <div class="container">
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb" id="breadcrumb"></ol>
      </nav>
      <a href="#" id="back-link" class="d-block mb-3">&laquo; Back</a>
      <div class="row">
        <div class="col-md-6">
            <img id="main-image" class="img-fluid item_image item_thumb" alt="" style="object-fit:cover;aspect-ratio:1/1;" width="600" height="600">
          <div class="mt-2" id="image-thumbs"></div>
        </div>
        <div class="col-md-6" id="summary">
          <div class="simpleCart_shelfItem">
            <h1 id="product-title" class="item_name"></h1>
            <div id="product-badges" class="mb-2"></div>
            <span id="product-id" class="visually-hidden item_id"></span>
            <a id="product-url" href="#" class="visually-hidden item_url"></a>
            <p id="product-price" class="h4"></p>
            <div data-region="reviews-summary" class="mb-3 small">
              <!-- review summary injected here -->
              <a href="#reviews" class="me-2">Read reviews</a>
              <a href="#reviews" data-action="review-open">Write a review</a>
            </div>
            <p id="stock-status"></p>
            <p id="short-description"></p>
            <div id="category-badges" class="mb-3"></div>
            <div id="variant-options" class="mb-3"></div>
            <div class="d-flex align-items-center mb-3">
              <label for="product-qty" class="me-2">Qty</label>
              <input id="product-qty" type="number" class="form-control item_Quantity" value="1" min="1" style="width:90px;">
            </div>
            <button type="button" class="btn btn-primary item_add mb-3">Add to Cart</button>
            <section id="details-accordion" class="mt-4">
              <details open>
                <summary>Details</summary>
                <div id="details"></div>
              </details>
              <details>
                <summary>How to use</summary>
                <div id="how-to"></div>
              </details>
              <details>
                <summary>Ingredients</summary>
                <div id="ingredients"></div>
              </details>
              <details>
                <summary>Good to know</summary>
                <div id="good-to-know"></div>
              </details>
              <details>
                <summary>Shipping &amp; returns</summary>
                <div id="shipping-returns"></div>
              </details>
            </section>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="mobile-atc-bar" class="mobile-atc d-md-none" hidden>
    <span id="mobile-atc-info"></span>
    <button type="button" id="mobile-atc-btn" class="btn btn-primary">Add to Cart</button>
  </div>
  <div id="live-region" class="visually-hidden" aria-live="polite"></div>
  <section class="py-5" id="reviews" data-region="reviews">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">Reviews</h2>
        <button type="button" class="btn btn-primary" data-action="review-open">Write a review</button>
      </div>
      <div data-component="reviews-controls" class="mb-4"></div>
      <div data-component="reviews-list"></div>
      <button type="button" class="btn btn-outline-secondary mt-4" data-action="reviews-load-more">Load more</button>
    </div>
  </section>

  <section class="py-5 d-none" id="recently-viewed-section">
    <div class="container">
      <h2 class="mb-4">Recently viewed</h2>
      <div id="recently-viewed" class="row"></div>
    </div>
  </section>

  </main>

  <footer class="py-4 mt-5">
    <div class="container text-center">
      <p class="mb-2">© 4D Cosmetics</p>
      <a href="/privacy.html" class="me-3">Privacy Policy</a>
      <a href="/terms.html">Terms</a>
      <div class="mt-2">
        <a href="#" class="text-dark me-2"><i class="fab fa-facebook"></i></a>
        <a href="#" class="text-dark me-2"><i class="fab fa-twitter"></i></a>
        <a href="#" class="text-dark"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/jquery-2.2.4.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/simpleCart.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/storefront-runtime.js"></script>
  <script src="/assets/js/header-nav.js"></script>
  <script type="module" src="/assets/js/product-page.js"></script>
  <script type="module" src="/assets/js/reviews.js"></script>
  <script src="/assets/js/diagnostics-overlay.js" defer></script>
</body>
</html>
