<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | 4D Cosmetics</title>
    <meta name="description" content="">
    <link rel="canonical" id="canonical-link" href="">
    <meta property="og:title" content="" id="og-title">
    <meta property="og:description" content="" id="og-description">
    <meta property="og:url" content="" id="og-url">
    <meta property="og:image" content="" id="og-image">
    <script type="application/ld+json" id="ld-json"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/product-card.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
  <div class="container nav-container">
    <a href="/" class="logo">4DCosmetics</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/c/makeup/">Makeup</a>
      <a href="/c/perfume/">Perfume</a>
      <a href="/c/skincare/">Skincare</a>
      <a href="/c/accessories/">Accessories</a>
    </nav>
    <div class="nav-actions">
      <form class="search-form" action="/search/" method="get">
        <input type="search" name="q" placeholder="Search products…" aria-label="Search">
      </form>
      <a href="/cart.html" class="cart-link">
        🛒 <span class="cart-count simpleCart_quantity">0</span>
      </a>
    </div>
  </div>
</header>

  <main id="main">
<nav aria-label="Breadcrumb"><ol class="breadcrumb" id="breadcrumb"></ol></nav>

<section class="pdp container-narrow pdp">
  <div class="pdp__media">
    <div class="pdp__main aspect-1x1"></div>
    <div class="pdp__thumbs" aria-label="Product thumbnails"></div>
  </div>

  <div class="pdp__details">
    <p class="pdp__brand">{{ brand }}</p>
    <h1 class="pdp__title">{{ title }}</h1>
    <div class="pdp__rating" aria-label="{{ rating }} out of 5 stars, {{ reviews }} reviews">
      <span class="pdp__rating-stars" aria-hidden="true"></span>
      <span class="pc__rating-num">{{ rating }}</span>
      <span class="pc__rating-count">({{ reviews }})</span>
    </div>

    <div class="pdp__price"></div>

    <ul class="pdp__bullets">
      <!-- Render 3–6 key bullets (ingredients highlights, benefits, size) -->
      {{ bullets }}
    </ul>

    <div class="pdp__cta">
      <button class="btn-modern btn-modern--primary" data-atc>Add to Cart</button>
      <button class="btn-modern btn-modern--ghost">Add to Wishlist</button>
    </div>

    <div class="pdp-tabs">
      <nav class="pdp-tabs__nav" role="tablist">
        <button data-tab="desc" class="is-active">Description</button>
        <button data-tab="ingr">Ingredients</button>
        <button data-tab="use">How to Use</button>
        <button data-tab="rev">Reviews</button>
      </nav>
      <div class="pdp-tabs__panel is-active" data-panel="desc">{{ description }}</div>
      <div class="pdp-tabs__panel" data-panel="ingr">{{ ingredients }}</div>
      <div class="pdp-tabs__panel" data-panel="use">{{ how_to_use }}</div>
      <div class="pdp-tabs__panel" data-panel="rev">{{ reviews_html }}</div>
    </div>
  </div>
</section>

<!-- Sticky mobile ATC -->
<div class="mobile-atc">
  <button class="btn-modern btn-modern--primary" data-atc>Add to Cart</button>
  <div class="mobile-atc__price" id="mobile-atc-price"></div>
</div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container text-center">
      <p class="mb-2">© 4D Cosmetics</p>
      <a href="/privacy.html" class="me-3">Privacy Policy</a>
      <a href="/terms.html">Terms</a>
      <div class="mt-2">
        <a href="#" class="text-dark me-2"><i class="fab fa-facebook"></i></a>
        <a href="#" class="text-dark me-2"><i class="fab fa-twitter"></i></a>
        <a href="#" class="text-dark"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </footer>

<link rel="stylesheet" href="/assets/css/pdp.css">
<script src="/assets/js/jquery-2.2.4.min.js"></script>
<script src="/assets/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/simpleCart.min.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/storefront-runtime.js"></script>
<script src="/assets/js/header-nav.js"></script>
<script src="/assets/js/product-card.js"></script>
<script src="/assets/js/pdp.js"></script>
<script src="/assets/js/diagnostics-overlay.js" defer></script>
</body>
</html>
