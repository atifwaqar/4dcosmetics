<head>
  <meta charset="UTF-8">

  <title>Search | 4D Cosmetics</title>
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/product-card.css">

</head>
<body data-active-tab="Beauty">
  
<div id="site-header"></div>
<script src="/assets/js/partials.js"></script>

  <main class="bnz-main">
    <div class="container-narrow">
      <h1 class="mb-3" id="search-heading"></h1>
      <p id="results-count" aria-live="polite"></p>
      <div class="mb-3">
        <label for="sort" class="visually-hidden">Sort</label>
        <select id="sort" class="form-select w-auto">
          <option value="featured">Featured</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="name_asc">Name A-Z</option>
          <option value="newest">Newest</option>
        </select>
      </div>
      <div id="search-grid" class="product-grid"></div>
      <div id="search-empty" class="d-none">
        <p>No products found for “<span id="empty-query"></span>”.</p>
        <div id="empty-links"></div>
      </div>
      <div class="bnz-progress" id="search-progress" hidden>
        <div class="bnz-progress__label">You’ve viewed <span id="search-viewed">0</span> of <span id="search-total">0</span> products</div>
        <div class="bnz-progress__bar"><span id="search-bar" style="width:0%"></span></div>
      </div>
      <div class="bnz-loadmore"><button id="load-more" class="btn btn-outline-dark">Load More</button></div>
    </div>
  </main>
  
<div id="site-footer"></div>

  <script src="/assets/js/jquery-2.2.4.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/simpleCart.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/money.js"></script>
  <script src="/assets/js/storefront-runtime.js"></script>
  <script src="/assets/js/product-card.js"></script>
  <script src="/assets/js/tabs.js"></script>
  <script src="/assets/js/search.js"></script>
  <script type="module" src="/assets/js/ui-cards.js"></script>
  <script type="module" src="/assets/js/search-page.js"></script>
  <script>
  window.__updateSearchProgress = function(viewed, total){
    var wrap = document.getElementById('search-progress');
    if(!wrap) return;
    wrap.hidden = false;
    document.getElementById('search-viewed').textContent = viewed;
    document.getElementById('search-total').textContent = total;
    var pct = total ? Math.min(100, Math.round((viewed/total)*100)) : 0;
    document.getElementById('search-bar').style.width = pct + '%';
  };
  </script>
  <script src="/assets/js/whatsapp-fab.js"></script>
  <script src="/assets/js/header-affordance.js" defer></script>
  <script src="/assets/js/cart-drawer.js" defer></script>
</body>
