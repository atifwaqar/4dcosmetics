<!DOCTYPE html>
<html data-whatsapp="923315033342" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - 4D Cosmetics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/product-card.css">
  <link rel="stylesheet" href="/assets/css/bonanza-layout.css">
  <link rel="stylesheet" href="/assets/css/cart.css">
  <link rel="stylesheet" href="/assets/css/checkout.css">
  <link rel="stylesheet" href="/assets/css/bonanza-overrides.css">
  <link rel="stylesheet" href="/assets/css/thank-you.css">
  <link rel="stylesheet" href="/assets/css/cart-drawer.css">
</head>
<body data-active-tab="Beauty">

<div id="site-header"></div>
<script src="/assets/js/partials.js"></script>

  <main class="container thankyou-layout">
    <div class="thankyou-card">
      <div class="thankyou-icon"><i class="fa-solid fa-circle-check"></i></div>
      <h1>Thank you</h1>
      <p>Your order has been received.</p>
      <div id="order-receipt"></div>
      <a href="/" class="btn btn-primary mt-3">Continue shopping</a>
    </div>
  </main>


  <div id="site-footer"></div>

  <script src="/assets/js/jquery-2.2.4.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/simpleCart.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/money.js"></script>
  <script src="/assets/js/storefront-runtime.js"></script>
  <script src="/assets/js/product-card.js"></script>
  <script src="/assets/js/tabs.js"></script>
  <script type="module">
    const data = localStorage.getItem('4d-last-order');
    const receipt = document.getElementById('order-receipt');
    const url = new URL(window.location);
    if(data){
      const order = JSON.parse(data);
      const pm = url.searchParams.get('pm');
      const txn = url.searchParams.get('txn');
      let html = `<p><strong>Order ID:</strong> ${order.id}</p>`;
      if(txn) html += `<p><strong>Reference:</strong> ${txn}</p>`;
      html += '<ul>' + order.items.map(i=>`<li>${i.name} × ${i.quantity} = ${moneyPKR(i.subtotal)}</li>`).join('') + '</ul>';
      html += `<p><strong>Total:</strong> ${moneyPKR(order.amount)}</p>`;
      if(pm) html += `<p><strong>Payment method:</strong> ${pm === 'whatsappCod' ? 'WhatsApp COD' : pm}</p>`;
      receipt.innerHTML = html;
    } else {
      receipt.innerHTML = '<p>Thank you for your purchase.</p>';
    }
  </script>
  <script src="/assets/js/whatsapp-fab.js"></script>
  <script src="/assets/js/header-affordance.js" defer></script>
  <script src="/assets/js/cart-drawer.js" defer></script>
</body>
</html>
